# devices/peridot/device.conf: Xiaomi POCO F6 / Redmi Turbo 3 (SM8635).

device peridot
	title       POCO F6 / Redmi Turbo 3
	vendor      Xiaomi
	soc         sm8635
	defconfig   peridot_defconfig
	firmware    pull-firmware.sh
	maintainer  HakiOS Peridot
	status      display     works     UEFI GOP framebuffer (0xe3940000, 1220x2712 @ 120 Hz)
	status      touch       works     Goodix GT9916R Berlin-D on SPI (touchscreen=1, touch_no_rpmh=1)
	status      buttons     works     PMXR2230 power + volume-down + SPMI GPIO6 volume-up
	status      cpu         partial   8 cores (3x A520 + 4x A720 + 1x X4) via PSCI, cpufreq tables ported
	status      gpu         works     Adreno 735 (0x43030b00) + GMU 0x07020100 + AdrenoMetal/Turnip
	status      storage     works     UFS via loader block service (ufs=2)
	status      audio       works     ADSP ELF + Sound/Speaker (adsp=1, sound=4)
	status      battery     works     QMIBattMgr via ADSP Glink (battery=1)
	status      haptic      works     AW8697 LRA with built-in peridot waveforms (haptic=5)
	status      camera      missing   not ported yet
	status      torch       missing   not ported yet
	status      wifi        works     WCN6750 WPSS + ath11k PCIe/QMI (wifi=1, BDF n16t)
	status      bluetooth   partial   WCN6750 H4 UART transport ported (bt=1)
	status      cellular    missing   SM8635 MPSS/IPA addresses recorded in soc.args
	status      network     works     en0 over Wi-Fi (WCN6750)
	status      thermal     works     81 thermal zones across 3 TSENS blocks + thermal governor
	status      usb         partial   UEFI fastboot protocol in xnuloader
	status      sensors     missing   not ported yet
